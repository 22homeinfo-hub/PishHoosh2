<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>پیش‌هوش | چت دفتر املاک دیار</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #ffffff;
        --brand: #0f766e;
        --brand-soft: #ccfbf1;
        --muted: #64748b;
        --user: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(160deg, #134e4a, #0f172a 60%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .wrap { width: 100%; max-width: 480px; }
      .card {
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: min(78vh, 720px);
      }
      header {
        background: var(--brand);
        color: #fff;
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header p { margin: 2px 0 0; font-size: 12px; opacity: 0.85; }
      #log { flex: 1; overflow-y: auto; padding: 16px; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 84%; padding: 10px 14px; border-radius: 16px; line-height: 1.9; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
      .bot { background: #fff; border: 1px solid #e2e8f0; border-top-right-radius: 4px; align-self: flex-start; }
      .me { background: var(--user); color: #fff; border-top-left-radius: 4px; align-self: flex-end; }
      .typing { color: var(--muted); font-size: 12px; align-self: flex-start; }
      form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; background: #fff; }
      input {
        flex: 1; border: 1px solid #cbd5e1; border-radius: 12px; padding: 11px 14px;
        font-size: 14px; font-family: inherit; outline: none;
      }
      input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
      button {
        border: 0; background: var(--brand); color: #fff; border-radius: 12px;
        padding: 0 18px; font-size: 14px; font-family: inherit; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .hint { color: #94a3b8; font-size: 11px; text-align: center; padding: 8px; background: #fff; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; background: #fff; }
      .chip { border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <header>
          <span class="dot"></span>
          <div>
            <h1>پیش‌هوش — دفتر املاک دیار</h1>
            <p>ثبت اطلاعات فایل و تخمین قیمت</p>
          </div>
        </header>
        <div id="log"></div>
        <div class="chips" id="chips"></div>
        <form id="form">
          <input id="input" placeholder="پیام خود را بنویسید…" autocomplete="off" />
          <button id="send" type="submit">ارسال</button>
        </form>
        <div class="hint">برای شروع مجدد بنویسید «شروع مجدد» — صفحه نمونهٔ تست API است</div>
      </div>
    </div>

    <script>
      // شناسهٔ نشست در localStorage نگه داشته می‌شود تا با رفرش، مکالمه حفظ شود
      const sessionId =
        localStorage.getItem("pishhoosh.sid") ||
        crypto.randomUUID?.() ||
        String(Date.now()) + "-" + Math.random().toString(16).slice(2);
      localStorage.setItem("pishhoosh.sid", sessionId);

      const log = document.getElementById("log");
      const chips = document.getElementById("chips");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");

      function add(text, who) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return div;
      }

      function typing(on) {
        let el = document.getElementById("typing");
        if (on && !el) {
          el = document.createElement("div");
          el.id = "typing";
          el.className = "typing";
          el.textContent = "پیش‌هوش در حال نوشتن…";
          log.appendChild(el);
          log.scrollTop = log.scrollHeight;
        } else if (!on && el) {
          el.remove();
        }
        send.disabled = on;
      }

      function renderChips(projects) {
        chips.innerHTML = "";
        (projects || []).forEach((p, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = (i + 1) + ". " + p.name;
          b.onclick = () => { input.value = String(i + 1); form.requestSubmit(); };
          chips.appendChild(b);
        });
      }

      async function post(url, body) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "خطای سرور (" + res.status + ")");
        return data;
      }

      async function boot() {
        typing(true);
        try {
          const res = await fetch("api/welcome");
          const data = await res.json();
          add(data.message || "سلام 🌷", "bot");
          renderChips(data.projects);
        } catch (err) {
          add("ارتباط با سرور برقرار نشد: " + err.message, "bot");
        }
        typing(false);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        chips.innerHTML = "";
        add(text, "me");
        typing(true);
        try {
          const data = await post("api/message", { sessionId, text });
          add(data.message || "…", "bot");
          if (data.projects) renderChips(data.projects);
        } catch (err) {
          add("⚠️ " + err.message, "bot");
        }
        typing(false);
        input.focus();
      });

      boot();
    </script>
  </body>
</html>
